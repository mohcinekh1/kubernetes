stages:
  - test
  - build
  - security
  - validate
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  TRIVY_USERNAME: "$CI_REGISTRY_USER"
  TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"

test-backend:
  stage: test
  image: node:22-alpine
  script:
    - cd app/backend
    - npm ci
    - npm test
  rules:
    - changes:
        - app/backend/**/*
        - .gitlab-ci.yml

test-frontend:
  stage: test
  image: node:22-alpine
  script:
    - node --check app/frontend/app.js
  rules:
    - changes:
        - app/frontend/**/*
        - .gitlab-ci.yml

build-backend-image:
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$BACKEND_IMAGE" app/backend
    - docker push "$BACKEND_IMAGE"
  rules:
    - changes:
        - app/backend/**/*
        - .gitlab-ci.yml

build-frontend-image:
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$FRONTEND_IMAGE" app/frontend
    - docker push "$FRONTEND_IMAGE"
  rules:
    - changes:
        - app/frontend/**/*
        - .gitlab-ci.yml

scan-backend-image:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL "$BACKEND_IMAGE"
  needs:
    - build-backend-image
  rules:
    - changes:
        - app/backend/**/*
        - .gitlab-ci.yml

scan-frontend-image:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL "$FRONTEND_IMAGE"
  needs:
    - build-frontend-image
  rules:
    - changes:
        - app/frontend/**/*
        - .gitlab-ci.yml

validate-kubernetes-manifests:
  stage: validate
  image: alpine:3.20
  script:
    - apk add --no-cache curl tar
    - curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
    - tar -xzf kubeconform.tar.gz kubeconform
    - chmod +x kubeconform
    - ./kubeconform -summary -ignore-missing-schemas infra/k8s/*.yaml
  rules:
    - changes:
        - infra/k8s/**/*
        - .gitlab-ci.yml

deploy-local-minikube:
  stage: deploy
  tags:
    - local-minikube
  script:
    - kubectl config current-context
    - kubectl get nodes
    - kubectl apply -f infra/k8s/
    - kubectl rollout status deployment/database -n k8s-lab --timeout=180s
    - kubectl rollout status deployment/backend -n k8s-lab --timeout=180s
    - kubectl rollout status deployment/frontend -n k8s-lab --timeout=180s
    - kubectl get pods -n k8s-lab
  environment:
    name: local-minikube
    url: http://k8s-lab.local
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
