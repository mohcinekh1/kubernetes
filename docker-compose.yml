services:
  database:
    image: postgres:16-alpine
    container_name: k8s_lab_database
    environment:
      POSTGRES_DB: k8s_lab_db
      POSTGRES_USER: k8s_lab_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - k8s_lab_network

  backend:
    build:
      context: ./app/backend
    container_name: k8s_lab_backend
    environment:
      PORT: 5000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: k8s_lab_db
      DB_USER: k8s_lab_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5001:5000"
    depends_on:
      - database
    networks:
      - k8s_lab_network

  frontend:
    build:
      context: ./app/frontend
    container_name: k8s_lab_frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - k8s_lab_network

volumes:
  postgres_data:

networks:
  k8s_lab_network:
    driver: bridge
